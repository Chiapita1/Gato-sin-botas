name: Alerta Favorito en Desventaja

# Se ejecuta sola cada 30 minutos, todos los días, entre las 15:00 y las 23:55
# hora española aprox. GitHub usa UTC, así que 15:00-23:55 España (verano,
# UTC+2) equivale a 13:00-21:55 UTC. Ajusta el rango si quieres cubrir más o
# menos horas.
on:
  schedule:
    - cron: "*/30 13-21 * * *"
  workflow_dispatch:  # te permite lanzarlo manualmente desde GitHub también

jobs:
  comprobar-alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar comprobación de alertas
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerta_favorito_desventaja.py

      - name: Guardar el estado (alertas ya enviadas)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add alertas_enviadas.json
          git diff --staged --quiet || git commit -m "Actualizar alertas enviadas"
          git push
