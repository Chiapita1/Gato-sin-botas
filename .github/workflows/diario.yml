name: Analisis diario
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  correr-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Guardar historial de resultados
        run: |
          mkdir -p docs
          cp picks_historial.json docs/data.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picks_historial.json docs/data.json
          git diff --quiet --cached || git commit -m "Actualizar historial de picks [skip ci]"
          git pull --rebase origin main
          git push
